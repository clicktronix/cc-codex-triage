name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The threads-pane mod is validated and tested by the Claude Code CLI itself;
      # 2.1.287 is the first release that loads mods.
      - run: npm install -g @anthropic-ai/claude-code@2.1.310
      - run: bash tests/run.sh
